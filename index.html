<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쿠키런 교실 젤리 대장</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Tone.js for Game Sound Effects -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <!-- Google Fonts: Jua (Cute Game Font) & Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    /* Custom CookieRun-inspired Game Theme Styles */
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #FFF8E7;
      background-image: radial-gradient(#F3E5AB 2px, transparent 2px);
      background-size: 24px 24px;
      color: #4A2C11;
      overflow-x: hidden;
    }

    .font-game {
      font-family: 'Jua', sans-serif;
    }

    /* Game-style 3D Buttons */
    .btn-game {
      transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 5px 0 rgba(74, 44, 17, 0.25);
    }
    .btn-game:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 rgba(74, 44, 17, 0.25);
    }

    .btn-pink {
      background: linear-gradient(180deg, #FF8FAB 0%, #FF5C8A 100%);
      border: 3px solid #C9184A;
      color: white;
      box-shadow: 0 5px 0 #C9184A;
    }
    .btn-pink:active {
      box-shadow: 0 1px 0 #C9184A;
    }

    .btn-mint {
      background: linear-gradient(180deg, #63E6BE 0%, #20C997 100%);
      border: 3px solid #099268;
      color: #064E3B;
      box-shadow: 0 5px 0 #099268;
    }
    .btn-mint:active {
      box-shadow: 0 1px 0 #099268;
    }

    .btn-gold {
      background: linear-gradient(180deg, #FFE066 0%, #FCC419 100%);
      border: 3px solid #E67700;
      color: #5D3A1A;
      box-shadow: 0 5px 0 #E67700;
    }
    .btn-gold:active {
      box-shadow: 0 1px 0 #E67700;
    }

    .btn-brown {
      background: linear-gradient(180deg, #8B5A2B 0%, #6F4E37 100%);
      border: 3px solid #4A2C11;
      color: #FFF8E7;
      box-shadow: 0 5px 0 #4A2C11;
    }
    .btn-brown:active {
      box-shadow: 0 1px 0 #4A2C11;
    }

    /* Cookie Card Styling */
    .cookie-card {
      background: #FFFFFF;
      border: 4px solid #E6CCB2;
      border-radius: 1.5rem;
      box-shadow: 0 8px 0 #DDB892;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .cookie-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 11px 0 #DDB892;
    }

    /* Animations */
    @keyframes jellyBounce {
      0%, 100% { transform: translateY(0) scale(1); }
      30% { transform: translateY(-18px) scale(1.1, 0.9); }
      60% { transform: translateY(4px) scale(0.95, 1.05); }
      80% { transform: translateY(-6px) scale(1.02, 0.98); }
    }
    .animate-jelly {
      animation: jellyBounce 0.7s ease;
    }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .animate-float {
      animation: floatSlow 3s ease-in-out infinite;
    }

    @keyframes heartPop {
      0% { transform: scale(0.3); opacity: 0; }
      50% { transform: scale(1.25); opacity: 1; }
      75% { transform: scale(0.9); }
      100% { transform: scale(1); }
    }
    .animate-heart-pop {
      animation: heartPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #FFF8E7;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
      background: #DDB892;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #B08968;
    }
  </style>
</head>

    // =========================================================================
    // 2. SOUND EFFECTS (Tone.js Synthesizer - No External URLs)
    // =========================================================================
    const SoundFX = {
      enabled: true,
      init() {
        if (Tone.context.state !== 'running') {
          Tone.start().catch(() => {});
        }
      },
      playPop() {
        if (!this.enabled) return;
        try {
          this.init();
          const synth = new Tone.Synth({ oscillator: { type: 'sine' } }).toDestination();
          const now = Tone.now();
          synth.triggerAttackRelease('C5', '16n', now);
          synth.triggerAttackRelease('E5', '16n', now + 0.08);
        } catch (e) {}
      },
      playApprove() {
        if (!this.enabled) return;
        try {
          this.init();
          const synth = new Tone.PolySynth(Tone.Synth).toDestination();
          const now = Tone.now();
          synth.triggerAttackRelease(['C5', 'E5', 'G5'], '16n', now);
          synth.triggerAttackRelease(['E5', 'G5', 'C6'], '8n', now + 0.12);
        } catch (e) {}
      },
      playHeartComplete() {
        if (!this.enabled) return;
        try {
          this.init();
          const synth = new Tone.PolySynth(Tone.Synth).toDestination();
          const now = Tone.now();
          synth.triggerAttackRelease('C5', '8n', now);
          synth.triggerAttackRelease('E5', '8n', now + 0.12);
          synth.triggerAttackRelease('G5', '8n', now + 0.24);
          synth.triggerAttackRelease(['C6', 'E6', 'G6'], '2n', now + 0.36);
        } catch (e) {}
      },
      playError() {
        if (!this.enabled) return;
        try {
          this.init();
          const synth = new Tone.Synth({ oscillator: { type: 'triangle' } }).toDestination();
          synth.triggerAttackRelease('A3', '16n', Tone.now());
        } catch (e) {}
      }
    };

    // =========================================================================
    // 3. STATE & DATABASE MANAGEMENT (Firestore + In-Memory Fallback)
    // =========================================================================
    const state = {
      role: null, // null | 'student' | 'teacher'
      currentStudentId: null,
      teacherTab: 'pending', // 'pending' | 'students' | 'activities' | 'reports' | 'backup'
      studentSearch: '',
      studentSort: 'score_desc', // 'score_desc' | 'name_asc'

      isFirestore: false,
      db: null,
      appId: 'default-app-id',
      userId: null,

      // Core Data
      students: [],
      activities: [],
      requests: [], // { id, studentId, studentName, cookieId, activityId, activityName, amount, status: 'pending'|'approved'|'rejected', createdAt, approvedAt, month }

          { id: 'req_2', studentId: 'stu_2', studentName: '이서연', cookieId: 'bright', activityId: 'act_3', activityName: '모둠 게임 승리', amount: 3, status: 'approved', createdAt: d2, approvedAt: d2, month: thisMonth },

        auditLogs: [

    // Initialize Database (Firestore if available, else In-Memory)
    async function initDatabase() {
      try {
        if (typeof __firebase_config !== 'undefined' && __firebase_config) {
          const firebaseConfig = JSON.parse(__firebase_config);
          state.appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
          const fbApp = initializeApp(firebaseConfig);
          const auth = getAuth(fbApp);
          state.db = getFirestore(fbApp);

          // RULE 3: Auth before queries
          if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            await signInWithCustomToken(auth, __initial_auth_token);
          } else {
            await signInAnonymously(auth);
          }
          state.userId = auth.currentUser?.uid || 'anon';
          state.isFirestore = true;

          // Subscribe to collections (RULE 1 & 2: Strict paths, no complex queries)
          const basePath = ['artifacts', state.appId, 'public', 'data'];
          
          onSnapshot(collection(state.db, ...basePath, 'students'), (snap) => {
            state.students = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            if (state.students.length === 0 && !localStorage.getItem('jelly_seeded_' + state.appId)) {
              seedFirestoreSampleData();
            }
            render();
          }, (err) => console.error('Students listen error:', err));

          onSnapshot(collection(state.db, ...basePath, 'activities'), (snap) => {
            state.activities = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            render();
          }, (err) => console.error('Activities listen error:', err));

          onSnapshot(collection(state.db, ...basePath, 'requests'), (snap) => {
            state.requests = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            render();
          }, (err) => console.error('Requests listen error:', err));

          onSnapshot(collection(state.db, ...basePath, 'auditLogs'), (snap) => {
            state.auditLogs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            render();
          }, (err) => console.error('Logs listen error:', err));

          return;
        }
      } catch (e) {
        console.warn('Firestore unavailable, using local in-memory mode:', e);
      }

      // Fallback: In-memory mode with sample data
      const sample = getSampleData();
      state.students = sample.students;
      state.activities = sample.activities;
      state.requests = sample.requests;
      state.auditLogs = sample.auditLogs;
      render();
    }

    async function seedFirestoreSampleData() {
      if (!state.isFirestore || !state.userId) return;
      try {
        localStorage.setItem('jelly_seeded_' + state.appId, 'true');
      } catch (e) {}
      const sample = getSampleData();
      const basePath = ['artifacts', state.appId, 'public', 'data'];
      for (const s of sample.students) {
        await setDoc(doc(state.db, ...basePath, 'students', s.id), s);
      }
      for (const a of sample.activities) {
        await setDoc(doc(state.db, ...basePath, 'activities', a.id), a);
      }
      for (const r of sample.requests) {
        await setDoc(doc(state.db, ...basePath, 'requests', r.id), r);
      }
      for (const l of sample.auditLogs) {
        await setDoc(doc(state.db, ...basePath, 'auditLogs', l.id), l);
      }
    }

    // Data Mutation Helpers (Works seamlessly for both Firestore and In-Memory)
    async function dbSave(colName, id, data) {
      if (state.isFirestore && state.userId) {
        await setDoc(doc(state.db, 'artifacts', state.appId, 'public', 'data', colName, id), data);
      } else {
        const idx = state[colName].findIndex(item => item.id === id);
        if (idx >= 0) state[colName][idx] = { id, ...data };
        else state[colName].push({ id, ...data });
        render();
      }
    }

    async function dbUpdate(colName, id, partial) {
      if (state.isFirestore && state.userId) {
        await updateDoc(doc(state.db, 'artifacts', state.appId, 'public', 'data', colName, id), partial);
      } else {
        const item = state[colName].find(i => i.id === id);
        if (item) Object.assign(item, partial);
        render();
      }
    }

    async function dbDelete(colName, id) {
      if (state.isFirestore && state.userId) {
        await deleteDoc(doc(state.db, 'artifacts', state.appId, 'public', 'data', colName, id));
      } else {
        state[colName] = state[colName].filter(i => i.id !== id);
        render();
      }
    }

    async function addAuditLog(message) {
      const id = 'log_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
      await dbSave('auditLogs', id, { id, message, createdAt: new Date().toISOString() });
    }

    // 4. HELPER FUNCTIONS
    // =========================================================================
    function getCookie(cookieId) {
      return COOKIE_CHARACTERS.find(c => c.id === cookieId) || COOKIE_CHARACTERS[0];
    }

    function getClassStats() {
      const totalJellies = state.students.reduce((sum, s) => sum + (Number(s.totalJellies) || 0), 0);
      const hearts = Math.floor(totalJellies / 20);
      const remainder = totalJellies % 20;
      const needed = 20 - remainder;
      const progressPct = (remainder / 20) * 100;
      return { totalJellies, hearts, remainder, needed, progressPct };
    }

    function formatDate(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      const m = d.getMonth() + 1;
      const day = d.getDate();
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      return `${m}월 ${day}일 ${hh}:${mm}`;
    }

    function showToast(msg, type = 'success') {
      const container = document.getElementById('toastContainer');
      const el = document.createElement('div');
      const bg = type === 'success' ? 'bg-[#20C997] text-[#064E3B] border-[#099268]' :
                 type === 'error' ? 'bg-[#FF5C8A] text-white border-[#C9184A]' :
                 'bg-[#FFE066] text-[#5D3A1A] border-[#E67700]';
      el.className = `px-4 py-3 rounded-2xl border-3 font-bold shadow-lg transform transition-all duration-300 translate-y-4 opacity-0 ${bg}`;
      el.innerText = msg;
      container.appendChild(el);
      requestAnimationFrame(() => {
        el.classList.remove('translate-y-4', 'opacity-0');
      });
      setTimeout(() => {
        el.classList.add('translate-y-4', 'opacity-0');
        setTimeout(() => el.remove(), 300);
      }, 2800);
    }

      const overlay = document.getElementById('modalOverlay');

      overlay.classList.remove('hidden');
      overlay.classList.add('flex');

    function closeModal() {

      // Teacher: Approve / Reject Request
      async approveRequest(reqId) {
        const req = state.requests.find(r => r.id === reqId);
        if (!req || req.status !== 'pending') return; // Prevent duplicate approval

        const prevHearts = getClassStats().hearts;
        const student = state.students.find(s => s.id === req.studentId);
        if (!student) return;

        const newTotal = (Number(student.totalJellies) || 0) + Number(req.amount);
        await dbUpdate('requests', reqId, {
          status: 'approved',
          approvedAt: new Date().toISOString()
        });
        await dbUpdate('students', student.id, { totalJellies: newTotal });
        await addAuditLog(`[승인] ${student.name} - ${req.activityName} (+${req.amount}젤리)`);

        const newHearts = getClassStats().hearts;
        if (newHearts > prevHearts) {
          SoundFX.playHeartComplete();
          this.showHeartCelebration(newHearts);
        } else {
          SoundFX.playApprove();
          showToast(`${student.name} 학생에게 +${req.amount} 젤리 지급 완료! 🎉`);
        }
      },

        SoundFX.playError();
        await dbUpdate('requests', reqId, { status: 'rejected', approvedAt: new Date().toISOString() });
        await addAuditLog(`[거절] ${req.studentName} - ${req.activityName} (+${req.amount}젤리)`);

              <h2 class="font-game text-2xl sm:text-3xl text-[#5D3A1A] flex items-center gap-2">
                학급 하트 ${hearts}개 완성!
                <span class="text-base font-sans font-bold text-[#FF5C8A] bg-[#FFF0F6] px-3 py-1 rounded-xl">총 ${totalJellies} 젤리</span>
              </h2>
              <div class="flex flex-wrap items-center gap-1 mt-2">
                ${hearts > 0 ? heartIcons + extraHearts : '<span class="text-sm text-[#7F5539]">첫 번째 하트를 향해 달려보아요! 🏃‍♂️</span>'}
              </div>
            </div>

            <div class="w-full md:w-72 bg-[#FFF8E7] p-3 rounded-2xl border-2 border-[#E6CCB2]">
              <div class="flex justify-between text-xs font-bold text-[#5D3A1A] mb-1.5">
                <span>다음 하트까지</span>
                <span class="text-[#FF5C8A]">${needed} 젤리 남음! (${remainder}/20)</span>
              </div>
              <div class="w-full h-5 bg-[#E6CCB2] rounded-full overflow-hidden border-2 border-[#DDB892]">
                <div class="h-full bg-gradient-to-r from-[#FF8FAB] to-[#FF5C8A] transition-all duration-500 rounded-full" style="width: ${progressPct}%"></div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderHomeView() {
      const studentCards = state.students.map(s => {
        const cookie = getCookie(s.cookieId);
        return `
          <button onclick="app.enterStudentMode('${s.id}')"
            class="cookie-card p-4 flex flex-col items-center text-center cursor-pointer hover:bg-[#FFFDF7]">
            <div class="w-20 h-20 rounded-2xl p-1.5 mb-2" style="background:${cookie.bg}">
              ${cookie.svg}
            </div>
            <div class="font-game text-xl text-[#5D3A1A]">${s.name}</div>
            <div class="text-xs text-[#7F5539] mb-2">${cookie.name}</div>
            <div class="px-3 py-1 rounded-full bg-[#FFE066] text-[#5D3A1A] font-game text-sm border-2 border-[#E67700]">
              🍬 ${s.totalJellies} 젤리
            </div>
          </button>
        `;
      }).join('');

      return `
        ${renderClassHeartBanner()}

        <div class="flex flex-col sm:flex-row items-center justify-between gap-4 mb-6">
          <div>
            <h2 class="font-game text-2xl sm:text-3xl text-[#5D3A1A]">나는 누구인가요? 🍪</h2>
            <p class="text-sm text-[#7F5539]">자신의 쿠키 카드를 눌러 젤리를 신청하고 확인하세요!</p>
          </div>
          <button onclick="app.promptTeacherLogin()" class="w-full sm:w-auto px-6 py-3 rounded-2xl font-game text-lg btn-game btn-brown flex items-center justify-center gap-2">
            <span>👩‍🏫</span> 교사 모드 (관리자)
          </button>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
          ${studentCards}
        </div>
      `;
    }

    function renderStudentView() {
      const student = state.students.find(s => s.id === state.currentStudentId);
      if (!student) return renderHomeView();
      const cookie = getCookie(student.cookieId);
      const thisMonth = new Date().toISOString().slice(0, 7);

      const myRequests = state.requests
        .filter(r => r.studentId === student.id)
        .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

      const pendingReqs = myRequests.filter(r => r.status === 'pending');
      const approvedReqs = myRequests.filter(r => r.status === 'approved');
      const monthJellies = approvedReqs
        .filter(r => (r.month || (r.approvedAt || '').slice(0, 7)) === thisMonth)
        .reduce((sum, r) => sum + Number(r.amount), 0);

      const pendingHtml = pendingReqs.length === 0
        ? `<p class="text-sm text-[#7F5539] py-4 text-center">승인 대기 중인 신청이 없어요.</p>`
        : pendingReqs.map(r => `
          <div class="flex items-center justify-between p-3 bg-[#FFF8E7] rounded-2xl border-2 border-[#FFE066]">
            <div>
              <div class="font-bold text-sm text-[#5D3A1A]">${r.activityName}</div>
              <div class="text-xs text-[#7F5539]">${formatDate(r.createdAt)}</div>
            </div>
            <div class="flex items-center gap-2">
              <span class="font-game text-[#FF5C8A]">+${r.amount}</span>
              <span class="px-2 py-1 rounded-lg bg-[#FFE066] text-[#5D3A1A] text-xs font-bold">승인 대기 중</span>
            </div>
          </div>
        `).join('');

      const historyHtml = approvedReqs.length === 0
        ? `<p class="text-sm text-[#7F5539] py-4 text-center">아직 획득한 젤리 기록이 없어요.</p>`
        : approvedReqs.slice(0, 15).map(r => `
          <div class="flex items-center justify-between p-3 bg-white rounded-2xl border-2 border-[#E6CCB2]">
            <div>
              <div class="font-bold text-sm text-[#5D3A1A]">${r.activityName}</div>
              <div class="text-xs text-[#7F5539]">${formatDate(r.approvedAt || r.createdAt)}</div>
            </div>
            <span class="px-3 py-1 rounded-xl bg-[#D1FAE5] text-[#065F46] font-game text-sm">+${r.amount} 젤리</span>
          </div>
        `).join('');

      return `
        ${renderClassHeartBanner()}

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <!-- Left: Profile & Big Action Button -->
          <div class="cookie-card p-6 flex flex-col items-center text-center">
            <div class="w-32 h-32 rounded-3xl p-2 mb-3 shadow-inner animate-float" style="background:${cookie.bg}">
              ${cookie.svg}
            </div>
            <h2 class="font-game text-3xl text-[#5D3A1A]">${student.name}</h2>
            <p class="text-sm text-[#7F5539] mb-4">${cookie.name}</p>

            <div class="w-full grid grid-cols-2 gap-3 mb-5">
              <div class="bg-[#FFF8E7] p-3 rounded-2xl border-2 border-[#E6CCB2]">
                <div class="text-xs text-[#7F5539] font-bold">현재 보유 젤리</div>
                <div class="font-game text-2xl text-[#FF5C8A]">🍬 ${student.totalJellies}</div>
              </div>
              <div class="bg-[#FFF8E7] p-3 rounded-2xl border-2 border-[#E6CCB2]">
                <div class="text-xs text-[#7F5539] font-bold">이번 달 획득</div>
                <div class="font-game text-2xl text-[#20C997]">📅 ${monthJellies}</div>
              </div>
            </div>

            <button onclick="app.openRequestModal()" class="w-full py-4 rounded-2xl font-game text-xl btn-game btn-pink mb-3">
              🍬 젤리 신청하기!
            </button>
            <button onclick="app.openCookieSelectModal()" class="w-full py-2.5 rounded-2xl font-bold text-sm bg-[#E6CCB2] hover:bg-[#DDB892] text-[#5D3A1A] transition">
              🎨 내 쿠키 캐릭터 바꾸기
            </button>
          </div>

          <!-- Right: Pending & History -->
          <div class="lg:col-span-2 space-y-6">
            <div class="bg-white border-4 border-[#FFE066] rounded-3xl p-5 shadow-md">
              <h3 class="font-game text-xl text-[#5D3A1A] mb-3 flex items-center gap-2">
                <span>⏳</span> 승인 대기 중인 신청 (${pendingReqs.length})
              </h3>
              <div class="space-y-2 max-h-56 overflow-y-auto">
                ${pendingHtml}
              </div>
            </div>

            <div class="bg-white border-4 border-[#E6CCB2] rounded-3xl p-5 shadow-md">
              <h3 class="font-game text-xl text-[#5D3A1A] mb-3 flex items-center gap-2">
                <span>📜</span> 나의 젤리 획득 기록
              </h3>
              <div class="space-y-2 max-h-72 overflow-y-auto">
                ${historyHtml}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderTeacherView() {
      const pendingCount = state.requests.filter(r => r.status === 'pending').length;

      const tabs = [
        { id: 'pending', label: `승인 대기 (${pendingCount})`, icon: '⏳' },
        { id: 'students', label: '학생 관리', icon: '🍪' },
        { id: 'activities', label: '활동 설정', icon: '🎯' },
        { id: 'reports', label: '월별/날짜별 기록', icon: '📊' },
        { id: 'backup', label: '데이터 백업', icon: '💾' }
      ];

      const tabButtons = tabs.map(t => `
        <button onclick="app.setTeacherTab('${t.id}')"
          class="px-4 py-2.5 rounded-2xl font-bold text-sm flex items-center gap-1.5 transition whitespace-nowrap ${state.teacherTab === t.id ? 'bg-[#FF5C8A] text-white shadow-md' : 'bg-white text-[#5D3A1A] border-2 border-[#E6CCB2] hover:bg-[#FFF8E7]'}">
          <span>${t.icon}</span> ${t.label}
        </button>
      `).join('');

      let tabContent = '';

      // TAB 1: PENDING REQUESTS
      if (state.teacherTab === 'pending') {
        const pendingList = state.requests
          .filter(r => r.status === 'pending')
          .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

        tabContent = pendingList.length === 0
          ? `<div class="bg-white rounded-3xl p-10 text-center border-4 border-[#E6CCB2]">
              <div class="text-5xl mb-3">🎉</div>
              <h3 class="font-game text-2xl text-[#5D3A1A]">대기 중인 신청이 없습니다!</h3>
              <p class="text-sm text-[#7F5539] mt-1">학생들이 젤리를 신청하면 이곳에 바로 나타납니다.</p>
            </div>`
          : `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${pendingList.map(r => {
                const cookie = getCookie(r.cookieId);
                return `
                  <div class="bg-white border-4 border-[#FFE066] rounded-3xl p-4 shadow-md flex flex-col justify-between gap-4">
                    <div class="flex items-center gap-3">
                      <div class="w-14 h-14 rounded-2xl p-1 shrink-0" style="background:${cookie.bg}">${cookie.svg}</div>
                      <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-2">
                          <span class="font-game text-xl text-[#5D3A1A] truncate">${r.studentName}</span>
                          <span class="px-2 py-0.5 rounded-lg bg-[#FFF0F6] text-[#C9184A] font-game text-sm">+${r.amount} 젤리</span>
                        </div>
                        <div class="font-bold text-sm text-[#4A2C11]">${r.activityName}</div>
                        <div class="text-xs text-[#7F5539]">${formatDate(r.createdAt)}</div>
                      </div>
                    </div>
                    <div class="flex gap-2">
                      <button onclick="app.rejectRequest('${r.id}')" class="flex-1 py-2.5 rounded-xl font-bold bg-[#E6CCB2] hover:bg-[#DDB892] text-[#5D3A1A] text-sm">거절</button>
                      <button onclick="app.approveRequest('${r.id}')" class="flex-2 w-2/3 py-2.5 rounded-xl font-game text-base btn-game btn-mint">승인하기 ✓</button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>`;
      }

      // TAB 2: STUDENTS MANAGEMENT
      else if (state.teacherTab === 'students') {
        let filtered = state.students.filter(s => s.name.includes(state.studentSearch.trim()));
        if (state.studentSort === 'score_desc') {
          filtered.sort((a, b) => (b.totalJellies || 0) - (a.totalJellies || 0));
        } else {
          filtered.sort((a, b) => a.name.localeCompare(b.name, 'ko'));
        }

        tabContent = `
          <div class="bg-white border-4 border-[#E6CCB2] rounded-3xl p-5 shadow-md">
            <div class="flex flex-col sm:flex-row gap-3 justify-between mb-5">
              <div class="flex gap-2 flex-1">
                <input type="text" value="${state.studentSearch}" oninput="app.setStudentSearch(this.value)"
                  placeholder="학생 이름 검색..." class="flex-1 p-2.5 rounded-xl border-2 border-[#DDB892] bg-[#FFF8E7] text-sm">
                <select onchange="app.setStudentSort(this.value)" class="p-2.5 rounded-xl border-2 border-[#DDB892] bg-[#FFF8E7] text-sm font-bold">
                  <option value="score_desc" ${state.studentSort === 'score_desc' ? 'selected' : ''}>점수 높은 순</option>
                  <option value="name_asc" ${state.studentSort === 'name_asc' ? 'selected' : ''}>이름 순</option>
                </select>
              </div>
              <button onclick="app.openAddStudentModal()" class="px-4 py-2.5 rounded-xl font-bold btn-game btn-mint text-sm">+ 새 학생 등록</button>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
              ${filtered.map(s => {
                const cookie = getCookie(s.cookieId);
                return `
                  <div class="p-4 rounded-2xl border-3 border-[#E6CCB2] bg-[#FFF8E7] flex items-center justify-between gap-3">
                    <div class="flex items-center gap-3 min-w-0">
                      <div class="w-12 h-12 rounded-xl p-1 shrink-0" style="background:${cookie.bg}">${cookie.svg}</div>
                      <div class="min-w-0">
                        <div class="font-game text-lg text-[#5D3A1A] truncate">${s.name}</div>
                        <div class="font-game text-sm text-[#FF5C8A]">🍬 ${s.totalJellies} 젤리</div>
                      </div>
                    </div>
                    <div class="flex flex-col gap-1">
                      <button onclick="app.openAdjustScoreModal('${s.id}')" class="px-2.5 py-1 rounded-lg bg-[#FFE066] text-[#5D3A1A] text-xs font-bold">점수수정</button>
                      <button onclick="app.deleteStudent('${s.id}')" class="px-2.5 py-1 rounded-lg bg-[#FFD6E0] text-[#C9184A] text-xs font-bold">삭제</button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }

      // TAB 3: ACTIVITIES SETTINGS
      else if (state.teacherTab === 'activities') {
        tabContent = `
          <div class="bg-white border-4 border-[#E6CCB2] rounded-3xl p-5 shadow-md">
            <h3 class="font-game text-xl text-[#5D3A1A] mb-4">젤리 획득 활동 설정</h3>
            <div class="flex flex-col sm:flex-row gap-2 mb-5">
              <input id="newActName" type="text" placeholder="새 활동 이름 (예: 독서 퀴즈 정답)" class="flex-1 p-3 rounded-xl border-2 border-[#DDB892] bg-[#FFF8E7]">
              <input id="newActAmount" type="number" min="1" max="20" value="1" class="w-24 p-3 rounded-xl border-2 border-[#DDB892] bg-[#FFF8E7] text-center font-bold">
              <button onclick="app.addActivity()" class="px-5 py-3 rounded-xl font-bold btn-game btn-mint">추가</button>
            </div>
            <div class="space-y-2">
              ${state.activities.map(a => `
                <div class="flex items-center justify-between p-3 rounded-2xl bg-[#FFF8E7] border-2 border-[#E6CCB2]">
                  <span class="font-bold text-[#5D3A1A]">${a.name}</span>
                  <div class="flex items-center gap-3">
                    <span class="px-3 py-1 rounded-xl bg-[#FFE066] text-[#5D3A1A] font-game">+${a.amount} 젤리</span>
                    <button onclick="app.deleteActivity('${a.id}')" class="text-xs font-bold text-[#C9184A] hover:underline">삭제</button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      // TAB 4: MONTHLY & DATE REPORTS
      else if (state.teacherTab === 'reports') {
        const monthReqs = state.requests.filter(r => r.status === 'approved' && (r.month || (r.approvedAt || '').slice(0, 7)) === state.selectedMonth);
        
        const studentMonthly = state.students.map(s => {
          const sReqs = monthReqs.filter(r => r.studentId === s.id);
          const mJellies = sReqs.reduce((sum, r) => sum + Number(r.amount), 0);
          return { ...s, mJellies, mCount: sReqs.length };
        }).sort((a, b) => b.mJellies - a.mJellies);

        tabContent = `
          <div class="space-y-6">
            <div class="bg-white border-4 border-[#E6CCB2] rounded-3xl p-5 shadow-md">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
                <h3 class="font-game text-xl text-[#5D3A1A]">월별 학생 누적 리포트</h3>
                <input type="month" value="${state.selectedMonth}" onchange="app.setSelectedMonth(this.value)"
                  class="p-2 rounded-xl border-2 border-[#DDB892] bg-[#FFF8E7] font-bold text-[#5D3A1A]">
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                  <thead>
                    <tr class="border-b-2 border-[#E6CCB2] text-xs text-[#7F5539]">
                      <th class="py-2 px-3">학생</th>
                      <th class="py-2 px-3">쿠키 캐릭터</th>
                      <th class="py-2 px-3 text-center">이달 활동 횟수</th>
                      <th class="py-2 px-3 text-right">이달 획득 젤리</th>
                      <th class="py-2 px-3 text-right">전체 누적 합계</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-[#FFF8E7]">
                    ${studentMonthly.map(s => {
                      const c = getCookie(s.cookieId);
                      return `
                        <tr class="hover:bg-[#FFF8E7]">
                          <td class="py-2.5 px-3 font-bold">${s.name}</td>
                          <td class="py-2.5 px-3 text-sm text-[#7F5539]">${c.name}</td>
                          <td class="py-2.5 px-3 text-center">${s.mCount}회</td>
                          <td class="py-2.5 px-3 text-right font-game text-[#20C997]">+${s.mJellies}</td>
                          <td class="py-2.5 px-3 text-right font-game text-[#FF5C8A]">${s.totalJellies}</td>
                        </tr>
                      `;
                    }).join('')}
                  </tbody>
                </table>
              </div>
            </div>

            <div class="bg-white border-4 border-[#E6CCB2] rounded-3xl p-5 shadow-md">
              <h3 class="font-game text-xl text-[#5D3A1A] mb-3">최근 교사 관리 및 승인 이력</h3>
              <div class="space-y-2 max-h-60 overflow-y-auto text-sm">
                ${state.auditLogs.slice().sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 30).map(l => `
                  <div class="flex justify-between p-2.5 rounded-xl bg-[#FFF8E7]">
                    <span class="text-[#4A2C11]">${l.message}</span>
                    <span class="text-xs text-[#7F5539] shrink-0 ml-2">${formatDate(l.createdAt)}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      }

      // TAB 5: BACKUP
      else if (state.teacherTab === 'backup') {
        tabContent = `
          <div class="bg-white border-4 border-[#E6CCB2] rounded-3xl p-6 shadow-md text-center">
            <div class="text-5xl mb-3">💾</div>
            <h3 class="font-game text-2xl text-[#5D3A1A] mb-2">데이터 백업 및 내보내기</h3>
            <p class="text-sm text-[#7F5539] mb-6">현재 학급의 모든 학생, 점수, 신청 내역, 기록을 JSON 파일로 안전하게 저장할 수 있습니다.</p>
            <button onclick="app.exportBackup()" class="px-8 py-3.5 rounded-2xl font-game text-lg btn-game btn-gold">
              백업 파일 다운로드 (.json)
            </button>
          </div>
        `;
      }

      return `
        ${renderClassHeartBanner()}
        <div class="flex items-center gap-2 overflow-x-auto pb-3 mb-4">
          ${tabButtons}
        </div>
        ${tabContent}
      `;
    }

    function render() {
      const main = document.getElementById('mainContainer');
      const navRole = document.getElementById('navRoleContainer');
      const navBadge = document.getElementById('navRoleBadge');

      if (state.role === 'teacher') {
        navRole.classList.remove('hidden');
        navBadge.innerText = '👩‍🏫 교사 모드';
        main.innerHTML = renderTeacherView();
      } else if (state.role === 'student') {
        const s = state.students.find(st => st.id === state.currentStudentId);
        navRole.classList.remove('hidden');
        navBadge.innerText = `🍪 ${s ? s.name : '학생'} 모드`;
        main.innerHTML = renderStudentView();
      } else {
        navRole.classList.add('hidden');
        main.innerHTML = renderHomeView();
      }
    }

    // Start App on Window Load
    window.addEventListener('DOMContentLoaded', () => {
      initDatabase();
    });
  </script>
</body>
</html>
